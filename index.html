<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinDoors Quotation Studio</title>
<meta name="description" content="Draw aluminium windows and doors to size, pick the profile series and glazing, and print a priced quotation with elevation drawings.">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314161a'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23d2a03f' stroke-width='2'/%3E%3Cline x1='16' y1='6' x2='16' y2='26' stroke='%23d2a03f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body data-tab="items">

<header id="topbar" class="topbar"></header>
<main id="mount" class="mount"></main>

<div id="boot" class="boot">
  <div class="boot-card">
    <div class="boot-mark"><svg viewBox="0 0 20 20" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.6" y="2.6" width="14.8" height="14.8" rx="1"/><path d="M10 2.6v14.8M2.6 10h14.8" stroke-width="1.1"/></svg></div>
    <h1>WinDoors</h1>
    <p>Loading the quotation studio…</p>
    <noscript><p class="boot-err">This tool needs JavaScript enabled.</p></noscript>
  </div>
</div>

<script type="module">
  import { start } from './assets/js/app.js';
  try {
    start();
  } catch (err) {
    console.error(err);
    const b = document.getElementById('boot');
    if (b) b.innerHTML = '<div class="boot-card"><h1>Something went wrong</h1><pre>' +
      String(err && err.message || err) + '</pre></div>';
  }
</script>
</body>
</html>
